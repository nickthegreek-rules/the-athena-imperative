<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Athena Imperative</title>
  <meta name="description" content="The most documented civilization in human history. Evidence-based repository for Greek historical continuity.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="wordmark">The <span>Athena</span> Imperative</div>
    <div class="tagline">The most documented civilization in human history</div>

    <div id="search-wrap">
      <input
        type="search"
        id="search-input"
        placeholder="Search claims, evidence, rebuttals, sources…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search the evidence repository"
      >
      <svg class="search-icon" viewBox="-16 -22 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <ellipse cx="0" cy="2" rx="13" ry="14"/>
        <path d="M-7,-10 L-10,-18 L-4,-12" fill="currentColor" stroke="none"/>
        <path d="M7,-10 L10,-18 L4,-12" fill="currentColor" stroke="none"/>
        <circle cx="-4.5" cy="0" r="3.5"/>
        <circle cx="-4.5" cy="0" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="4.5" cy="0" r="3.5"/>
        <circle cx="4.5" cy="0" r="1.2" fill="currentColor" stroke="none"/>
        <path d="M-2,5 L0,9 L2,5" fill="currentColor" stroke="none"/>
        <path d="M-13,2 Q-18,8 -13,14" stroke-width="1.2"/>
        <path d="M13,2 Q18,8 13,14" stroke-width="1.2"/>
      </svg>
    </div>

    <div id="stats-bar" aria-live="polite"></div>
    <p class="intro-hint" id="intro-hint">
      Try <strong>Alexander</strong>, <strong>DNA</strong>, <strong>Pella</strong>, <strong>Byzantine</strong>, <strong>Prespa</strong>
    </p>
  </header>

  <!-- Main -->
  <main id="main" role="main">

    <!-- Results -->
    <div id="results" role="region" aria-label="Search results" aria-live="polite"></div>

    <!-- No results -->
    <div id="no-results" style="display:none" role="alert">
      No evidence found for that query.
    </div>

  </main>

  <!-- Footer -->
  <footer id="footer">
    <span>Athena</span> · Wisdom · Strategy · Shield · Spear · Courage ·
    Stones don't lie. Coins don't lie. DNA doesn't lie.
  </footer>

</div>

<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
